name: Check Islington courts

on:
  schedule:
    - cron: "*/10 6-22 * * *"   # every 10 min, 06:00-22:59 UTC
    - cron: "40 20,21 * * *"    # just before the 22:00 UK release (covers GMT and BST)
  workflow_dispatch: {}          # lets you press "Run workflow" manually

concurrency:
  group: court-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for courts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BETTER_EMAIL: ${{ secrets.BETTER_EMAIL }}
          BETTER_PASSWORD: ${{ secrets.BETTER_PASSWORD }}
          START_DATE: "2026-11-10"
          EARLIEST_START: "19:00"
          LATEST_START: "21:00"
          NOTIFY_ONLY_HOURS: "4"
          AUTOBOOK: "true"
        run: python checker.py
      - name: Save memory of what was already sent
        run: |
          git config user.name "court-bot"
          git config user.email "court-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
